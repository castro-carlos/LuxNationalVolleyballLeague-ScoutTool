server {
    listen 80;
    server_name localhost;

    # 1. Serve React static production build files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirect all unknown routes back to index.html for React Router compatibility
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy /api requests to FastAPI container
    location /api/ {
        # 'backend' matches the service name in docker-compose.yml
        # The trailing slash strips '/api/' before forwarding to FastAPI
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}